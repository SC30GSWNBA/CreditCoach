[project]
name = "creditcoach"
version = "0.1.0"
description = "A grounded, guardrailed credit coach for first-time borrowers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "gradio>=4.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creditcoach"]
