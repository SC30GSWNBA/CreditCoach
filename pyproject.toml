[project]
name = "creditcoach"
version = "0.1.0"
description = "A grounded, guardrailed credit coach for first-time borrowers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "torch>=2.4",  # listed so Linux (the Railway image) gets the CPU-only build below
    "gradio>=4.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.2,<3",
    "plotly>=5.24",
    "psycopg[binary,pool]>=3.2",
    "nemoguardrails>=0.24.1",
    "redis>=8.1.0",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
]

# On Linux, torch comes from PyTorch's CPU-only index: the default Linux build pulls in about 40 NVIDIA packages
# (several GB) that a CPU server never uses. macOS is unchanged.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creditcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
